name: Build & Release Desktop Installers (Mac & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilar App e Gerar .dmg
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload Artefato macOS
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-macOS-dmg
          path: dist/RemoteDesk-macOS.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilar Executável Windows
        run: |
          pyinstaller --clean remotedesk.spec

      - name: Upload Artefato Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-Windows-exe
          path: dist/RemoteDesk.exe

  release:
    name: Criar GitHub Release com Instaladores
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artefatos Mac
        uses: actions/download-artifact@v4
        with:
          name: RemoteDesk-macOS-dmg
          path: release-files

      - name: Download Artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: RemoteDesk-Windows-exe
          path: release-files

      - name: Publicar Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
